appId: com.codexbar.windows
productName: CodexBar
directories:
  output: out
  buildResources: assets
files:
  - dist/**/*
  - package.json
# node-pty ships Node-API prebuilds compatible with both Node and Electron.
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
